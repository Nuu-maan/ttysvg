[package]
name = "ttysvg"
version = "0.1.0"
edition = "2021"
description = "Terminal recordings as self-contained animated SVG. Works on Windows."
license = "MIT"
repository = "https://github.com/nuu-maan/ttysvg"
readme = "README.md"
keywords = ["terminal", "svg", "recording", "conpty", "demo"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
gif = "0.14.2"
portable-pty = "0.8"
ratatui = "0.29"
regex = "1"
resvg = "0.48.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
vt100 = "0.15"

[dev-dependencies]
gif = "0.14"
insta = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
